name: "Unity iOS export and UNSIGNED IPA (NOT installable)"

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  export-xcode:
    name: export-xcode
    runs-on: ubuntu-latest
    steps:
      - name: Check required Unity credentials
        run: |
          if [[ -z "${UNITY_EMAIL//[[:space:]]/}" ]] || [[ -z "${UNITY_PASSWORD//[[:space:]]/}" ]]; then
            echo "::error::Required secrets UNITY_EMAIL and UNITY_PASSWORD are missing."
            exit 1
          fi
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - uses: actions/checkout@v4

      - name: Source and synthetic packaging preflight (not a Unity test)
        run: |
          python3 Tools/verify_source.py
          python3 Tools/test_ios_packaging.py

      - name: Export Unity iOS Xcode project only
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          buildMethod: NostalgiaBomb.Editor.CiBuild.ExportIOS
          unityVersion: 6000.0.60f1

      - name: Require actual Xcode project output
        run: |
          if [[ ! -f "build/iOS/Unity-iPhone.xcodeproj/project.pbxproj" ]]; then
            echo "::error::Unity iOS export did not produce the expected Xcode project."
            ls -lah build/ || true
            exit 1
          fi
          echo "Unity iOS Xcode export succeeded."

      - name: Upload Xcode project archive (NOT IPA)
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS/

  package-unsigned-ipa:
    name: package-unsigned-ipa
    needs: export-xcode
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode-project

      - name: Build unsigned IPA with xcodebuild
        run: |
          cd xcode-project
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/archive.xcarchive \
            archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          xcodebuild -exportArchive \
            -archivePath build/archive.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(cat <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>method</key>
  <string>development</string>
  <key>signingStyle</key>
  <string>manual</string>
  <key>stripSwiftSymbols</key>
  <true/>
</dict>
</plist>
PLIST
)

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: nostalgia-bomb-unsigned.ipa
          path: xcode-project/build/ipa/*.ipa
